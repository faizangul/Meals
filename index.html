<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meals</title>
<meta name="description" content="Meal ideas, portions, macros and supermarket prices.">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f100f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meals">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#141614;--mute:#6c716c;--faint:#9aa09a;--line:rgba(20,22,20,.1);--accent:#1c7a52;--accent-ink:#fff;--soft:rgba(20,22,20,.055);--hot:#bd4322;--mark:#ffe9a3;--aldi:#1f4aa0;--coles:#d3142b;--woolies:#128044;--bar:rgba(255,255,255,.82);--drawer:cubic-bezier(.32,.72,0,1)}
@media (prefers-color-scheme:dark){:root{--bg:#0f100f;--card:#1b1d1b;--ink:#f2f3f0;--mute:#9a9f99;--faint:#6f746e;--line:rgba(255,255,255,.1);--accent:#52c793;--accent-ink:#06130c;--soft:rgba(255,255,255,.08);--hot:#f29673;--mark:#5a4a14;--aldi:#7ea6f2;--coles:#ff7d8b;--woolies:#5fd08f;--bar:rgba(27,29,27,.82)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.detail{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
#app{max-width:600px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 20px}
h1{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.022em;margin:4px 0 14px}
h2{font-size:21px;line-height:1.22;font-weight:680;letter-spacing:-.015em;margin:0}
h3{font-size:13px;font-weight:600;color:var(--mute);margin:26px 0 8px 2px}
p{margin:0}
a{color:var(--accent);text-decoration:none}
.mute{color:var(--mute)}.small{font-size:13.5px}.num{font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea,select{font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=search]{background:var(--soft);border-color:transparent;-webkit-appearance:none;appearance:none}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;background:var(--soft);font-weight:600;font-size:15.5px;color:var(--ink);transition:transform 160ms ease-out}
.btn:active,.line:active,.ing:active{transform:scale(.98)}
.btn[disabled]{opacity:.4}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent;color:var(--mute)}
.btn.wide{width:100%}.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.card{background:var(--card);border-radius:16px;padding:16px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:2px}
.seg button{flex:1;min-height:34px;border-radius:8px;font-weight:600;color:var(--mute);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 13px;border-radius:17px;background:var(--soft);font-size:14px;font-weight:550;color:var(--mute)}
.chip.on{background:var(--ink);color:var(--bg)}
.macros{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;margin-top:14px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.macro{min-width:0;padding:0 4px 0 10px;border-left:1px solid var(--line)}
.macro:first-child{border-left:0;padding-left:0}
.macro b{display:block;font-size:20px;line-height:1.15;font-weight:680;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.macro span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.macro em{display:block;font-style:normal;font-size:11.5px;color:var(--faint)}
.macro.over em{color:var(--hot)}
.bar{display:block;height:3px;border-radius:2px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--accent);border-radius:2px}
.macro.over .bar u{background:var(--hot)}
.meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13.5px;color:var(--mute);margin-top:4px}
.why{font-size:13.5px;margin-top:10px;color:var(--mute)}
.hero{margin-top:12px}
.hero .kicker{font-size:12.5px;font-weight:600;color:var(--accent);margin-bottom:3px}
.line{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;color:inherit;border-bottom:1px solid var(--line);transition:transform 160ms ease-out}
.lines>div:last-child .line,.line:last-child{border-bottom:0}
.line b,.name{font-weight:590}
.chev{flex:none;color:var(--faint);font-size:18px;line-height:1}
.list{background:var(--card);border-radius:16px;padding:0 14px;margin-top:8px}
.tag-hot{color:var(--hot);font-weight:600}
.compare{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:16px;padding:12px 0;margin-top:8px}
.compare>div{padding:0 12px;border-left:1px solid var(--line);min-width:0}
.compare>div:first-child{border-left:0}
.compare b{display:block;font-size:19px;font-weight:680;font-variant-numeric:tabular-nums;margin-top:2px}
.compare small{display:block;font-size:12px;color:var(--mute);line-height:1.3}
.compare .low b{color:var(--accent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--c);vertical-align:1px}
.step{display:flex;align-items:center;flex:none}
.step button{width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:21px;line-height:1;font-weight:450;transition:transform 160ms ease-out}
.step button:active{transform:scale(.94)}
.step input{width:72px;text-align:center;border:0;background:transparent;padding:6px 0;font-weight:680;font-size:20px;font-variant-numeric:tabular-nums;border-radius:8px}
.ing{display:block;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line);transition:transform 160ms ease-out}
.ing:last-child{border-bottom:0}
.ing .top{display:flex;align-items:baseline;gap:10px}
.ing .amt{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.ing.chg .amt{color:var(--accent)}
.ing .sub{font-size:12.5px;color:var(--mute);margin-top:1px}
.ing .costs{display:flex;gap:12px;margin-top:4px;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.ing .costs .low{color:var(--accent);font-weight:620}
.also{font-size:13.5px;color:var(--mute);padding:11px 0}
.sec{font-size:12px;color:var(--mute);font-weight:620;padding:12px 0 0}
.opts{display:grid;grid-template-columns:1fr auto auto;gap:0}
.offer{display:grid;grid-template-columns:1fr 84px 62px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.offer:last-child{border-bottom:0}
.offer input{padding:7px 8px;font-variant-numeric:tabular-nums;text-align:right}
.offer input.own{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.offer .used{text-align:right;font-weight:620;font-variant-numeric:tabular-nums}
.offer-head{display:grid;grid-template-columns:1fr 84px 62px;gap:10px;font-size:11.5px;color:var(--mute);font-weight:600;text-align:right;margin-top:14px}
.offer-head span:first-child{text-align:left}
.ext{font-size:12.5px;display:block;margin-top:1px}
ol.steps{list-style:none;padding:4px 16px;margin:8px 0 0;background:var(--card);border-radius:16px}
ol.steps li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps .n{flex:none;width:20px;font-size:14px;font-weight:680;color:var(--accent);font-variant-numeric:tabular-nums}
mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 3px}
.note{background:var(--soft);border-radius:12px;padding:11px 13px;font-size:14px;margin-top:8px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding:5px 8px calc(5px + env(safe-area-inset-bottom));z-index:20}
nav.bottom{display:flex;justify-content:center}
nav.bottom a{flex:1;max-width:120px;text-align:center;color:var(--faint);font-size:11px;font-weight:550;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;position:relative}
nav.bottom a.on{color:var(--accent)}
nav.bottom svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:0;left:calc(50% + 7px);background:var(--hot);color:#fff;font-size:10.5px;font-weight:650;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.actions{display:flex;gap:8px;max-width:600px;margin:0 auto;padding:3px 8px}
.back{display:inline-flex;align-items:center;min-height:36px;color:var(--accent);font-weight:550;margin-left:-2px}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity 240ms ease}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90dvh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform 300ms var(--drawer);max-width:600px;margin:0 auto}
#sheet.on{transform:none}
.stars{display:flex;justify-content:center;gap:6px;margin:16px 0 8px}
.stars button{font-size:40px;line-height:1;width:52px;height:56px;color:var(--soft)}
.stars button.on{color:#e6a817}
.field{display:block;margin-top:12px}.field span{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-size:13px;margin-top:1px}
.check.on{background:var(--accent);border-color:var(--accent)}
.done{opacity:.45;text-decoration:line-through}
.shopline{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.shopline:last-child{border-bottom:0}
.shopline .right{flex:none;text-align:right}
.link{font-size:12.5px;color:var(--accent);min-height:28px}
.storepick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.storepick:last-child{border-bottom:0}
.storepick b{font-variant-numeric:tabular-nums;font-weight:680}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);flex:none}
.storepick.on .radio{border:6px solid var(--accent)}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.prices label{font-size:12px;color:var(--mute);font-weight:600}
.prices input{padding:7px 8px;margin-top:3px;font-variant-numeric:tabular-nums}
.prices input.own{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.empty{text-align:center;padding:42px 16px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity 200ms ease,transform 200ms ease;z-index:50;pointer-events:none;max-width:88%;width:max-content;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#ob{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:calc(34px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom))}
#ob>div{max-width:480px;margin:0 auto}
.pick{display:block;width:100%;text-align:left;padding:16px;border-radius:14px;background:var(--card);margin-top:10px;box-shadow:inset 0 0 0 1px var(--line)}
.pick.on{box-shadow:inset 0 0 0 2px var(--accent)}
.pick b{display:block;font-size:17px;font-weight:620;margin-bottom:2px}
.stepcount{font-size:13px;color:var(--mute);font-weight:550;margin-bottom:6px}
.card-rate{margin-top:12px}
.lines>div{content-visibility:auto;contain-intrinsic-size:auto 66px}
@media (prefers-reduced-motion:reduce){#sheet,.btn,.line,.ing,.step button,#toast{transition:opacity 150ms ease}.btn:active,.line:active,.ing:active,.step button:active{transform:none}}
</style>
</head>
<body>
<main id="app"></main>
<div id="navslot"></div>
<div id="veil" data-a="close"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-label="Details"></section>
<div id="toast" role="status" aria-live="polite"></div>
<div id="ob" hidden></div>
<input type="file" id="file" hidden>
<script type="module">
import * as C from './core.js';
const BUILD = 2;
const KS = 'meals.state.v1', KR = 'meals.recipes.v1', KC = 'meals.catalogue.v1';
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast('Could not save on this device'); return false; } };
const blank = () => ({ onboarded: false, mode: 'casual', target: { kcal: 2000, p: 150, c: 200, f: 60, meals: 3 }, diet: [], store: 'mix', history: {}, adjust: {}, plan: [], checked: {}, have: [], prices: {}, type: 'meal', seed: 0 });
const st = Object.assign(blank(), load(KS, {}));
let recipes = load(KR, []);
let rows = [], cat = new Map(), priced = '';
const persist = () => save(KS, st);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s) => document.querySelector(s);
const app = $('#app');
const adj = (id) => st.adjust[id] || {};
const byId = (id) => recipes.find((r) => r.id === id);
const plural = (w, n) => (n === 1 || w.endsWith('s') ? w : `${w}s`);
const perWord = (r) => (r.unit === 'whole recipe' ? 'serve' : r.unit);
const kg = (g) => (g >= 1000 ? `${(g / 1000).toFixed(g >= 10000 ? 0 : 1)} kg` : `${Math.round(g)} g`);
const dmy = (s) => new Date(s).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
const icons = { today: '<path d="M4 12a8 8 0 0 1 16 0H4zM3 15h18M7 19h10"/>', recipes: '<path d="M6 3h11a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2V5a2 2 0 0 1 1-2zM5 18a2 2 0 0 1 2-2h12"/>', shop: '<path d="M3 4h2l2.4 11h11L21 7H6M9 20h.01M17 20h.01"/>', prices: '<path d="M12 3v18M16.5 7.5C16 6 14.5 5 12 5 9.5 5 7.5 6.2 7.5 8.3c0 4.7 9 2.6 9 7.4 0 2-2 3.3-4.5 3.3-2.8 0-4.5-1.2-5-3"/>', you: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-7 8-7s7 2.5 8 7"/>' };

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }
function sheet(html) { $('#sheet').innerHTML = html; $('#sheet').classList.add('on'); $('#veil').classList.add('on'); }
function closeSheet() { openItem = null; $('#sheet').classList.remove('on'); $('#veil').classList.remove('on'); }

const route = () => (location.hash.slice(1) || 'today').split('/');
function nav() {
  const [r] = route();
  const tabs = [['today', 'Today'], ['recipes', 'Recipes'], ['shop', 'Shop'], ['prices', 'Prices'], ['you', 'You']];
  $('#navslot').innerHTML = r === 'r' ? '' : `<nav class="bottom">${tabs.map(([k, n]) => `<a href="#${k}" class="${r === k ? 'on' : ''}" ${r === k ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>${n}${k === 'shop' && st.plan.length ? `<span class="badge">${st.plan.length}</span>` : ''}</a>`).join('')}</nav>`;
  document.body.classList.toggle('detail', r === 'r');
}
let lastRoute = '';
function render() {
  const key = location.hash;
  const y = key === lastRoute ? scrollY : 0;
  lastRoute = key;
  nav();
  const [r, id] = route();
  if (r === 'r') renderRecipe(decodeURIComponent(id));
  else ({ today: renderToday, recipes: renderRecipes, shop: renderShop, prices: renderPrices, you: renderYou }[r] || renderToday)();
  scrollTo(0, y);
  if (openItem != null && r === 'r') paintItem();
}
addEventListener('hashchange', () => { closeSheet(); render(); });

const macroTiles = (per, target) => {
  const t = (k, label, unit = 'g') => {
    const over = target && per[k] > target[k] * 1.12;
    const pct = target && target[k] ? Math.min(100, (per[k] / target[k]) * 100) : 0;
    return `<div class="macro ${over ? 'over' : ''}"><b>${Math.round(per[k])}${k === 'kcal' ? '' : unit}</b><span>${label}</span>${target ? `<em>of ${Math.round(target[k])}${k === 'kcal' ? '' : unit}</em><i class="bar"><u style="width:${pct.toFixed(0)}%"></u></i>` : ''}</div>`;
  };
  return `<div class="macros">${t('kcal', 'Calories')}${t('p', 'Protein')}${t('c', 'Carbs')}${t('f', 'Fat')}</div>`;
};
const macroTarget = () => (st.mode === 'macro' ? C.perMealTarget(st.target) : null);
const needRecipes = (where) => `<div class="empty"><h2>No recipes yet</h2><p style="margin:8px 0 16px">Load your recipe file to get started. It stays on this device.</p><button class="btn main" data-a="import">Choose recipe file</button>${where === 'you' ? '' : '<p class="small" style="margin-top:14px"><a href="#you">Or add one by hand</a></p>'}</div>`;
const modeSwitch = () => `<div class="seg" role="group" aria-label="Planning style"><button data-a="mode" data-v="macro" class="${st.mode === 'macro' ? 'on' : ''}" aria-pressed="${st.mode === 'macro'}">Macro focus</button><button data-a="mode" data-v="casual" class="${st.mode === 'casual' ? 'on' : ''}" aria-pressed="${st.mode === 'casual'}">Casual</button></div>`;
const bestLine = (v) => `<span class="num"><i class="dot" style="--c:var(--${v.best.id})"></i>${C.aud(v.best.perServe)} per ${perWord(v.recipe)} at ${v.best.name}</span>`;

// ---------- Today
const pendingRatings = () => { const cut = Date.now() - 20 * 3600000; return st.plan.filter((p) => p.at < cut && byId(p.id)).slice(0, 2); };
function renderToday() {
  if (!recipes.length) { app.innerHTML = `<h1>What to make</h1>${needRecipes()}`; return; }
  const list = C.suggest(recipes, st.history, cat, st.prices, st.adjust, { mode: st.mode, target: st.target, type: st.type, diet: st.diet, seed: `${new Date().toDateString()}:${st.seed}` });
  const [top, ...rest] = list;
  const t = st.type === 'meal' ? macroTarget() : null;
  const asks = pendingRatings().map((p) => { const r = byId(p.id); return `<div class="card card-rate"><p>Did you end up making <b>${esc(r.name)}</b>?</p><div class="row" style="margin-top:10px"><button class="btn main grow" data-a="rate" data-id="${esc(r.id)}">Yes, rate it</button><button class="btn grow" data-a="later" data-id="${esc(r.id)}">Not yet</button></div></div>`; }).join('');
  app.innerHTML = `<h1>What to make</h1>${modeSwitch()}
  ${st.mode === 'macro' ? `<p class="small mute" style="margin-top:8px">About ${Math.round(C.perMealTarget(st.target).kcal)} kcal and ${Math.round(C.perMealTarget(st.target).p)}g protein a meal · <a href="#you">Change</a></p>` : ''}
  ${asks}
  <div class="chips">${[['meal', 'Meals'], ['snack', 'Snacks'], ['sweet', 'Sweet']].map(([k, n]) => `<button class="chip ${st.type === k ? 'on' : ''}" data-a="type" data-v="${k}">${n}</button>`).join('')}</div>
  ${top ? `<article class="card hero"><p class="kicker">Top pick</p><h2><a href="#r/${encodeURIComponent(top.recipe.id)}" style="color:inherit">${esc(top.recipe.name)}</a></h2>
  <div class="meta">${top.recipe.mins ? `<span>${top.recipe.mins} min</span>` : ''}<span>${bestLine(top.view)}</span></div>
  ${macroTiles(top.view.per, t)}

const unitLabel = (u) => ({ each: '', g: 'g', ml: 'ml', tbsp: 'tbsp', tsp: 'tsp', cup: 'cup', cups: 'cups', serving: 'serve', servings: 'serves', slice: 'slice', slices: 'slices', packet: 'packet', packets: 'packets', teaspoon: 'tsp', teaspoons: 'tsp', tablespoon: 'tbsp', tablespoons: 'tbsp', kg: 'kg', l: 'L', can: 'can', cans: 'cans' }[u] ?? u);

function setAdj(id, patch) {
  const a = { ...adj(id), ...patch };
  if (a.perServe && !Object.keys(a.perServe).length) delete a.perServe;
  if (a.servings == null) delete a.servings;
  if (!Object.keys(a).length) delete st.adjust[id]; else st.adjust[id] = a;
  persist();

}
function nudge(id, i, dir) {
  const r = byId(id);
  const it = C.viewRecipe(r, adj(id), cat, st.prices).items[i];
  const perUnit = it.g / it.q;
  const cur = it.perG / perUnit;
  const isWeight = ['g', 'ml'].includes(it.unit);
  const step = isWeight ? (cur >= 100 ? 10 : 5) : (cur >= 1 ? 0.5 : 0.25);
  setQty(id, i, Math.max(0, (Math.round(cur / step) + dir) * step), r, it);
}
function setQty(id, i, qty, r, it) {
  const perServe = { ...(adj(id).perServe || {}) };
  const grams = qty * (it.g / it.q);
  if (Math.abs(grams - it.baseG) < 0.05) delete perServe[i]; else perServe[i] = grams;
  setAdj(id, { perServe });
}

  <div class="card"><div class="grid2">${n('kcal', 'Calories')}${n('p', 'Protein (g)')}${n('c', 'Carbs (g)')}${n('f', 'Fat (g)')}${n('meals', 'Meals a day')}</div><button class="btn wide" style="margin-top:12px" data-a="calc">Work these out for me</button></div>
  <h3>Leave these out</h3>
  <div class="chips" style="margin:0">${['chicken', 'beef', 'pork', 'seafood', 'turkey'].map((d) => `<button class="chip ${st.diet.includes(d) ? 'on' : ''}" data-a="diet" data-v="${d}">${d[0].toUpperCase() + d.slice(1)}</button>`).join('')}</div>
  <h3>Recipes</h3>
  <div class="card"><p>${recipes.length} recipes on this device.</p><div class="row wrap" style="margin-top:10px"><button class="btn" data-a="import">Import file</button><button class="btn" data-a="add">Add by hand</button></div></div>
  <h3>Your data</h3>
  <div class="card"><p class="small mute">Everything stays on this device. Save a backup before changing phones.</p><div class="row wrap" style="margin-top:10px"><button class="btn" data-a="backup">Save backup</button><button class="btn" data-a="restore">Restore</button></div></div>
  <button class="btn quiet wide" style="margin-top:14px" data-a="again">Run setup again</button>`;
}
function calcSheet() {
  const sel = (id, opts) => `<select id="${id}">${opts.map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select>`;
  sheet(`<h2>Work out my targets</h2><p class="mute small" style="margin-top:4px">A starting point. Adjust it as you learn what works.</p>
  <div class="grid2"><label class="field"><span>Sex</span>${sel('c-sex', [['m', 'Male'], ['f', 'Female']])}</label><label class="field"><span>Age</span><input id="c-age" inputmode="numeric" value="26"></label>
  <label class="field"><span>Weight (kg)</span><input id="c-kg" inputmode="decimal" value="80"></label><label class="field"><span>Height (cm)</span><input id="c-cm" inputmode="numeric" value="178"></label></div>
  <label class="field"><span>Activity</span>${sel('c-act', [['1.2', 'Mostly sitting'], ['1.375', 'Train 1 to 3 days'], ['1.55', 'Train 3 to 5 days'], ['1.725', 'Train 6 to 7 days']])}</label>
  <label class="field"><span>Goal</span>${sel('c-goal', [['-400', 'Lose fat'], ['0', 'Stay the same'], ['250', 'Build muscle']])}</label>
  <button class="btn main wide" style="margin-top:16px" data-a="calcgo">Use these numbers</button><button class="btn quiet wide" data-a="close">Cancel</button>`);
}
function addSheet() {
  sheet(`<h2>Add a recipe</h2>
  <label class="field"><span>Name</span><input id="a-name"></label>
  <div class="grid2"><label class="field"><span>Makes (serves)</span><input id="a-serv" inputmode="numeric" value="1"></label><label class="field"><span>Minutes</span><input id="a-min" inputmode="numeric"></label></div>
  <label class="field"><span>Ingredients, one per line</span><textarea id="a-ing" rows="6" placeholder="600g chicken breast&#10;2 eggs&#10;1 tbsp olive oil"></textarea></label>
  <label class="field"><span>Method, one step per line</span><textarea id="a-steps" rows="5"></textarea></label>
  <p class="small mute" style="margin-top:8px">Macros per serve. Leave blank to estimate from the ingredients.</p>
  <div class="grid2"><label class="field"><span>Calories</span><input id="a-kcal" inputmode="numeric"></label><label class="field"><span>Protein (g)</span><input id="a-p" inputmode="numeric"></label><label class="field"><span>Carbs (g)</span><input id="a-c" inputmode="numeric"></label><label class="field"><span>Fat (g)</span><input id="a-f" inputmode="numeric"></label></div>
  <button class="btn main wide" style="margin-top:16px" data-a="addgo">Save recipe</button><button class="btn quiet wide" data-a="close">Cancel</button>`);
}
function saveAdded() {
  const name = $('#a-name').value.trim();
  const lines = $('#a-ing').value.split('\n').map((s) => s.trim()).filter(Boolean);
  if (!name || !lines.length) { toast('Add a name and at least one ingredient'); return; }
  const servings = Math.max(1, Math.round(+$('#a-serv').value || 1));
  const items = lines.map((l) => C.parseIngredientLine(l, rows));
  const totals = { kcal: 0, p: 0, c: 0, f: 0 };
  for (const it of items) { const r = cat.get(it.ing); if (r && it.g) for (const k of Object.keys(totals)) totals[k] += (it.g * r[k]) / 100; }
  const val = (id, k) => { const v = $(`#a-${id}`).value; return v === '' ? Math.round(totals[k] / servings) : +v; };
  const r = { id: `own-${Date.now()}`, own: true, name, servings, unit: 'serve', mins: +$('#a-min').value || null, kcal: val('kcal', 'kcal'), p: val('p', 'p'), c: val('c', 'c'), f: val('f', 'f'), tags: ['savoury', 'mine'], items, steps: $('#a-steps').value.split('\n').map((s) => s.trim()).filter(Boolean), notes: [] };
  recipes.push(r); save(KR, recipes); closeSheet(); toast('Recipe saved'); location.hash = `#r/${encodeURIComponent(r.id)}`;
}

// ---------- Setup
let ob = null;
function renderOb() {
  const el = $('#ob');
  if (!ob) { el.hidden = true; return; }
  el.hidden = false;
  const t = st.target;
  const foot = (next, label = 'Continue') => `<button class="btn main wide" style="margin-top:22px" data-a="${next}">${label}</button>`;
  const n = (k, label) => `<label class="field"><span>${label}</span><input inputmode="numeric" data-t="${k}" value="${t[k]}"></label>`;
  const pages = {
    style: `<h1>Let's set you up</h1><p class="mute">How do you want Meals to choose for you?</p>
    <button class="pick ${st.mode === 'macro' ? 'on' : ''}" data-a="obmode" data-v="macro"><b>Macro focus</b><span class="mute small">Suggests meals that fit your daily calories and protein, and can resize portions to match.</span></button>
    <button class="pick ${st.mode === 'casual' ? 'on' : ''}" data-a="obmode" data-v="casual"><b>Casual</b><span class="mute small">Goes on what you've enjoyed, what's cheap and what's quick. No macro talk.</span></button>
    <p class="small mute" style="margin-top:12px">You can switch any time from the Today screen.</p>${foot(st.mode === 'macro' ? 'ob-target' : 'ob-diet')}`,
    target: `<h1>Your targets</h1><p class="mute">Per day. Close enough is fine, you can change them later.</p>
    <div class="grid2">${n('kcal', 'Calories')}${n('p', 'Protein (g)')}${n('c', 'Carbs (g)')}${n('f', 'Fat (g)')}${n('meals', 'Meals a day')}</div>
    <button class="btn wide" style="margin-top:12px" data-a="calc">Work these out for me</button>${foot('ob-diet')}`,
    diet: `<h1>Anything to leave out?</h1><p class="mute">Skip this if you eat everything.</p>
    <div class="chips" style="margin:14px 0 0;flex-wrap:wrap">${['chicken', 'beef', 'pork', 'seafood', 'turkey'].map((d) => `<button class="chip ${st.diet.includes(d) ? 'on' : ''}" data-a="diet" data-v="${d}">${d[0].toUpperCase() + d.slice(1)}</button>`).join('')}</div>${foot('ob-load')}`,
    load: `<h1>${recipes.length ? 'All set' : 'Add your recipes'}</h1><p class="mute">${recipes.length ? `${recipes.length} recipes are ready.` : 'Choose your recipe file. It stays on this device and is never uploaded.'}</p>
    ${recipes.length ? '' : '<button class="btn wide" style="margin-top:16px" data-a="import">Choose recipe file</button>'}${foot('ob-done', recipes.length ? 'Start' : 'Do this later')}`,
  };
  const order = st.mode === 'macro' ? ['style', 'target', 'diet', 'load'] : ['style', 'diet', 'load'];
  el.innerHTML = `<div><p class="stepcount">Step ${order.indexOf(ob) + 1} of ${order.length}</p>${pages[ob]}</div>`;
}

// ---------- Actions
function exportFile(name, data) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
let fileMode = 'recipes';
function chooseFile(mode) { fileMode = mode; const f = $('#file'); f.value = ''; f.click(); }
$('#file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (fileMode === 'restore') {
      if (data.format !== 'meals-backup' || !data.state) throw new Error('That file is not a Meals backup.');
      Object.assign(st, blank(), data.state); recipes = data.recipes || []; persist(); save(KR, recipes); toast('Backup restored');
    } else {
      const incoming = C.readPack(data);
      const ids = new Set(incoming.map((r) => r.id));
      recipes = [...recipes.filter((r) => !ids.has(r.id)), ...incoming];
      if (!save(KR, recipes)) return;
      toast(`${incoming.length} recipes added`);
    }
  } catch (err) { toast(err.message.startsWith('That') || err.message.startsWith('No ') ? err.message : "Couldn't read that file"); return; }
  renderOb(); render();
});
const A = {
  close: closeSheet,
  item: (e) => { openItem = +e.dataset.i; paintItem(); },
  batch: (e) => { ui.batch = e.dataset.v === '1'; render(); },
  back: () => { if (history.length > 1) history.back(); else location.hash = '#today'; },
  mode: (e) => { st.mode = e.dataset.v; persist(); render(); },
  type: (e) => { st.type = e.dataset.v; persist(); render(); },
  tag: (e) => { list.tag = e.dataset.v; renderRecipes(); },
  shuffle: () => { st.seed++; persist(); render(); scrollTo({ top: 0, behavior: 'smooth' }); },
  plan: (e) => { const id = e.dataset.id; if (inPlan(id)) st.plan = st.plan.filter((p) => p.id !== id); else { st.plan.push({ id, at: Date.now() }); toast('Added to your plan'); } persist(); render(); },
  unplan: (e) => { st.plan = st.plan.filter((p) => p.id !== e.dataset.id); persist(); render(); },
  skip: (e) => { const id = e.dataset.id; (st.history[id] ||= {}).skipUntil = Date.now() + C.SKIP_DAYS * 86400000; persist(); render(); toast("Won't suggest it this week"); },
  later: (e) => { const p = st.plan.find((x) => x.id === e.dataset.id); if (p) p.at = Date.now(); persist(); render(); },
  rate: (e) => rateSheet(e.dataset.id),
  star: (e) => rateSheet(e.dataset.id, +e.dataset.v),
  savestar: (e) => { const id = e.dataset.id, stars = +e.dataset.v; if (!stars) return; const h = (st.history[id] ||= {}); (h.log ||= []).push({ at: Date.now(), stars }); delete h.skipUntil; st.plan = st.plan.filter((p) => p.id !== id); persist(); closeSheet(); render(); toast(`Saved. Coming back ${C.repeatLabel(stars)}`); },
  'q-': (e) => nudge(route()[1] && decodeURIComponent(route()[1]), +e.dataset.i, -1),
  'q+': (e) => nudge(decodeURIComponent(route()[1]), +e.dataset.i, 1),
  's-': () => { const id = decodeURIComponent(route()[1]); const r = byId(id); const cur = adj(id).servings || r.servings; setAdj(id, { servings: Math.max(1, cur - 1) === r.servings ? null : Math.max(1, cur - 1) }); },
  's+': () => { const id = decodeURIComponent(route()[1]); const r = byId(id); const cur = adj(id).servings || r.servings; setAdj(id, { servings: cur + 1 === r.servings ? null : cur + 1 }); },
  reset: () => { const id = decodeURIComponent(route()[1]); delete st.adjust[id]; persist(); render(); },
  fit: () => { const id = decodeURIComponent(route()[1]); const a = C.fitToTarget(byId(id), adj(id), cat, C.perMealTarget(st.target), st.prices); st.adjust[id] = a; persist(); render(); toast('Portions adjusted to your target'); },
  del: (e) => { recipes = recipes.filter((r) => r.id !== e.dataset.id); save(KR, recipes); location.hash = '#recipes'; },
  store: (e) => { st.store = e.dataset.v; persist(); render(); },
  tick: (e) => { const v = e.dataset.v; if (st.checked[v]) delete st.checked[v]; else st.checked[v] = 1; persist(); render(); },
  home: (e) => { const v = e.dataset.v; st.have = st.have.includes(v) ? st.have.filter((x) => x !== v) : [...st.have, v]; persist(); render(); },
  clearticks: () => { st.checked = {}; persist(); render(); },
  copy: async () => {
    const l = window.__list;
    const lines = l.buy.map((r) => { const o = st.store === 'mix' ? r.best : r.offers.find((x) => x.store === st.store); return `${r.packs > 1 ? `${r.packs} x ` : ''}${r.ingredient.name} (${r.ingredient.packLabel})${o?.cost != null ? ` ${C.aud(o.cost)}${st.store === 'mix' ? ` ${o.name}` : ''}` : ''}`; });
    try { await navigator.clipboard.writeText(lines.join('\n')); toast('List copied'); } catch { toast("Couldn't copy on this browser"); }
  },
  calc: calcSheet,
  calcgo: () => { const g = (i) => +$(`#c-${i}`).value; Object.assign(st.target, C.suggestTargets({ sex: $('#c-sex').value, kg: g('kg'), cm: g('cm'), age: g('age'), activity: g('act'), goal: g('goal') })); persist(); closeSheet(); renderOb(); render(); toast('Targets updated'); },
  diet: (e) => { const v = e.dataset.v; st.diet = st.diet.includes(v) ? st.diet.filter((x) => x !== v) : [...st.diet, v]; persist(); renderOb(); render(); },
  import: () => chooseFile('recipes'),
  restore: () => chooseFile('restore'),
  add: addSheet,
  addgo: saveAdded,
  backup: () => exportFile(`meals-backup-${new Date().toISOString().slice(0, 10)}.json`, { format: 'meals-backup', version: 1, state: st, recipes }),
  again: () => { ob = 'style'; renderOb(); },
  obmode: (e) => { st.mode = e.dataset.v; persist(); renderOb(); },
  'ob-target': () => { ob = 'target'; renderOb(); },
  'ob-diet': () => { ob = 'diet'; renderOb(); },
  'ob-load': () => { ob = 'load'; renderOb(); },
  'ob-done': () => { st.onboarded = true; persist(); ob = null; renderOb(); render(); },
};
document.addEventListener('click', (e) => { const t = e.target.closest('[data-a]'); if (t && A[t.dataset.a] && !t.disabled) A[t.dataset.a](t); });
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { list.q = e.target.value; paintRecipes(); }
  if (e.target.id === 'pq') { pq.q = e.target.value; paintPrices(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'sort') { list.sort = t.value; paintRecipes(); return; }
  if (t.dataset.q != null) {
    const id = decodeURIComponent(route()[1]), i = +t.dataset.q, r = byId(id);
    const it = C.viewRecipe(r, adj(id), cat, st.prices).items[i];
    const v = parseFloat(t.value);
    if (Number.isFinite(v) && v >= 0) setQty(id, i, v, r, it); else render();
  }
  if (t.dataset.t) { const v = parseFloat(t.value); if (Number.isFinite(v) && v > 0) { st.target[t.dataset.t] = v; persist(); } else t.value = st.target[t.dataset.t]; }
  if (t.dataset.p) {
    const id = t.dataset.p, s = t.dataset.s, v = parseFloat(t.value);
    if (Number.isFinite(v) && v >= 0) { ((st.prices[id] ||= {})[s] = { price: v, at: Date.now() }); t.classList.add('own'); t.value = v.toFixed(2); persist(); toast('Price saved'); if (route()[0] === 'r') render(); }
    else if (t.value.trim() === '') { if (st.prices[id]) delete st.prices[id][s]; persist(); const p = C.priceOf(cat.get(id), s, st.prices); t.value = p ? p.price.toFixed(2) : ''; t.classList.remove('own'); if (route()[0] === 'r') render(); }
  }
});
window.__meals = { st, get recipes() { return recipes; }, set recipes(v) { recipes = v; save(KR, recipes); render(); } };

async function boot() {
  let data = null;
  try { const res = await fetch('data/ingredients.json', { cache: 'no-cache' }); if (res.ok) { data = await res.json(); save(KC, data); } } catch {}
  data ||= load(KC, null);
  if (!data) { app.innerHTML = '<div class="empty"><h2>Could not load</h2><p>Check your connection and try again.</p></div>'; return; }
  rows = data.ingredients; priced = data.priced; cat = C.indexCatalogue(rows);
  if (!st.onboarded) { ob = 'style'; renderOb(); }
  render();
}
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('Update ready. Reopen the app to use it.'); had = true; });
}
</script>
</body>
</html>
